name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias freegrind \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore free-grind.jks \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Free Grind, OU=Dev, O=Dev, L=City, S=State, C=US"

          echo "=== KEYSTORE BASE64 ==="
          base64 -w 0 free-grind.jks
          echo ""
          echo "=== ALIAS ==="
          echo "free-grind"
          echo "=== KEYSTORE PASSWORD ==="
          echo "android123"
          echo "=== KEY PASSWORD ==="
          echo "android123"
